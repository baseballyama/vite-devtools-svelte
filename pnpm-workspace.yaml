packages:
  - 'packages/*'
  - 'packages/client'
  - 'playground'
  - 'examples/*'
  - 'site'

minimumReleaseAgeExclude:
  - '@vitejs/devtools'
  - '@vitejs/devtools-kit'
  - '@vitejs/devtools-rolldown'
  - 'devframe'
  - '@devframes/*'
  - '@sveltejs/*'
  - 'svelte'
  - 'esrap'
  - 'devalue'
  - 'dts-buddy'
  - 'zimmerframe'
  - 'prettier-plugin-svelte'
  - 'svelte-check'
  - 'svelte2tsx'
  - 'esm-env'

# pnpm >= 11 reads settings only from this file (not package.json "pnpm").
allowBuilds:
  esbuild: true

peerDependencyRules:
  allowAny:
    - vite
    - vitest

# examples/ui-lib plays a published library: keep its injected copy under
# node_modules (pnpm would otherwise dedupe it back to a symlink).
dedupeInjectedDeps: false

# Svelte with the devtools instrumentation channel (`svelte/internal/devtools`),
# from a local checkout of https://github.com/sveltejs/svelte/tree/emit-dev-events
# (run `pnpm install && pnpm -C packages/svelte build` there first; CI builds
# it with .github/actions/svelte-branch).
overrides:
  svelte: link:../svelte-emit-dev-events/packages/svelte
