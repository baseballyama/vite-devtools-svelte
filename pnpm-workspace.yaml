packages:
  - 'packages/*'
  - 'packages/client'
  - 'playground'
  - 'examples/*'
  - 'site'

minimumReleaseAgeExclude:
  - '@vitejs/devtools'
  - '@vitejs/devtools-kit'
  - '@vitejs/devtools-rolldown'
  - 'devframe'
  - '@devframes/*'

# pnpm >= 11 reads settings only from this file (not package.json "pnpm").
allowBuilds:
  esbuild: true

peerDependencyRules:
  allowAny:
    - vite
    - vitest
