<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Svelte DevTools</title>
    <script>
      // Sets the initial theme before the stylesheet loads to avoid a flash; theme.svelte.ts owns it afterwards.
      (() => {
        try {
          const stored = localStorage.getItem('svelte-devtools-theme');
          document.documentElement.dataset.theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #111214;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
