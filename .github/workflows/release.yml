name: Release

# Publishing uses npm Trusted Publishers (OIDC), so there is no NPM_TOKEN: the
# package must trust this repo + workflow at
# https://www.npmjs.com/package/@sveltejs/vite-devtools-svelte/access.
#
# changesets/action needs Settings → Actions → General → Workflow permissions:
# "Read and write permissions" + "Allow GitHub Actions to create and approve
# pull requests".

on:
  push:
    branches:
      - main

permissions:
  contents: write # create/merge release PR, push tags, GitHub Releases
  pull-requests: write # open the "Version Packages" PR
  id-token: write # OIDC: npm Trusted Publishers auth + provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Node 24: Trusted Publishers need npm >= 11.5.1, and Node 22 ships npm 10.
      # The setup action sets no `registry-url`: setup-node would then write an
      # `_authToken` into .npmrc, which forces token auth and blocks OIDC.
      - uses: ./.github/actions/setup
        with:
          node-version: '24'

      # Same order as ci.yml: the apps' tsconfigs extend files that
      # `svelte-kit sync` generates, and sync loads vite.config files that
      # import the built plugin, so lint needs the plugin built first.
      - run: pnpm build:plugin
      - run: pnpm sync:kit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'
