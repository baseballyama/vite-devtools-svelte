name: CI

# Every job is independent and starts at once; the slowest one sets the
# wall-clock time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup

      # Type-aware lint resolves each SvelteKit app's tsconfig, which extends
      # the generated .svelte-kit/tsconfig.json; sync loads each app's
      # vite.config, which imports the built plugin.
      - name: Build plugin + SvelteKit sync
        run: |
          pnpm build:plugin
          pnpm sync:kit

      - name: oxlint (type-aware)
        run: pnpm exec oxlint

      - name: ESLint (eslint-plugin-svelte)
        if: ${{ !cancelled() }}
        run: pnpm exec eslint .

      - name: Format (oxfmt)
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: Unused files, exports and dependencies (knip)
        if: ${{ !cancelled() }}
        run: pnpm knip

      - name: Workspace dependency consistency (sherif)
        if: ${{ !cancelled() }}
        run: pnpm sherif

      - name: Typecheck (plugin, client, inspector)
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      # Additive TypeScript 7 check (plugin + client only). The packages keep
      # typescript ^6.0.3 for peers and API consumers; the TS 7 native compiler
      # is the root @typescript/native alias, which svelte-check finds via --tsgo.
      - name: Typecheck with TypeScript 7 (additive)
        if: ${{ !cancelled() }}
        run: |
          node node_modules/@typescript/native/bin/tsc -v
          node node_modules/@typescript/native/bin/tsc -p packages/vite-devtools-svelte/tsconfig.json
          pnpm -C packages/client exec svelte-check --tsgo --tsconfig ./tsconfig.app.json

  test:
    name: Tests + builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup

      - name: Build plugin, inspector and client UI
        run: pnpm build

      # Coverage thresholds are enforced per package (vitest.config.ts).
      - name: Tests with coverage (plugin + client + inspector)
        run: pnpm test:coverage

      - name: Package lint (publint + are-the-types-wrong)
        if: ${{ !cancelled() }}
        run: pnpm publint

      # The dev-only virtual modules must not leak into a production bundle
      # (guards the resolveId/load dev-only gates).
      - name: Playground production build has no devtools runtime
        if: ${{ !cancelled() }}
        working-directory: playground
        env:
          NODE_ENV: production
        run: |
          pnpm exec vite build
          if grep -RIn --include='*.js' --include='*.html' 'svelte-devtools-hooks' .svelte-kit/output build 2>/dev/null; then
            echo "::error::Devtools virtual modules leaked into production build"
            exit 1
          fi

      # The example exists to enforce a nonce-based CSP; check that the built
      # app actually sends it. Only the preview server started here is stopped.
      - name: strict-csp-app sends its nonce-based CSP header
        if: ${{ !cancelled() }}
        working-directory: examples/strict-csp-app
        timeout-minutes: 3
        run: |
          pnpm exec vite build
          node node_modules/vite/bin/vite.js preview --port 4319 --strictPort > preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null --max-time 2 http://localhost:4319/ && break
            sleep 1
          done
          headers=$(curl -sf -D - -o /dev/null --max-time 10 http://localhost:4319/ || true)
          if ! grep -qi "^content-security-policy:.*script-src 'self' 'nonce-" <<< "$headers"; then
            echo "::error::strict-csp-app did not send its nonce-based CSP header"
            echo "$headers"
            cat preview.log
            exit 1
          fi
          grep -i '^content-security-policy:' <<< "$headers"

      # The apps have no svelte-check of their own: use the workspace's
      # (installed in the sample-app example) against each app's tsconfig.
      - name: Playground & strict-csp-app typecheck (svelte-check)
        if: ${{ !cancelled() }}
        run: |
          pnpm -C playground exec svelte-kit sync
          pnpm -C examples/sample-app exec svelte-check --workspace ../../playground --tsconfig ./tsconfig.json
          pnpm -C examples/strict-csp-app exec svelte-kit sync
          pnpm -C examples/sample-app exec svelte-check --workspace ../strict-csp-app --tsconfig ./tsconfig.json

  # The live site ('before') and vite.dev ('reference') are captured best
  # effort, for comparison only.
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          chromium: 'true'

      - name: Build site
        working-directory: site
        # Same env as site.yml, so the QA below checks what is deployed.
        env:
          NODE_ENV: production
          BASE_PATH: /vite-devtools-svelte
        run: pnpm build

      - name: Site typecheck (svelte-check)
        run: |
          pnpm -C site exec svelte-kit sync
          pnpm -C examples/sample-app exec svelte-check --workspace ../../site --tsconfig ./tsconfig.json

      - name: Site screenshots + QA
        run: node site/scripts/capture.mjs --out=site-shots --build=site/build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: site-shots
          path: site-shots/
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compat plain-svelte, standalone
            run: node e2e/compat/prepare.mjs plain-svelte && node e2e/compat/smoke.mjs plain-svelte --tier=2
          - name: compat plain-svelte, dock
            run: node e2e/compat/prepare.mjs plain-svelte && node e2e/compat/smoke.mjs plain-svelte --dock --tier=2
          - name: compat kit3, standalone
            run: node e2e/compat/prepare.mjs kit3 && node e2e/compat/smoke.mjs kit3 --tier=2
          - name: compat kit3, dock
            run: node e2e/compat/prepare.mjs kit3 && node e2e/compat/smoke.mjs kit3 --dock --tier=2
          - name: reactivity (MCP)
            run: node e2e/reactivity.mjs
          # Output is scanned for machine paths, codes and tokens; a hit fails
          # instead of being written.
          - name: screenshots
            run: |
              node scripts/screenshots/reactivity.mjs --out=e2e-out/reactivity-shots
              node scripts/screenshots/mcp-examples.mjs --out=e2e-out/mcp-examples
            artifact: reactivity-shots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          chromium: 'true'

      - name: Build plugin, inspector and client UI
        run: pnpm build

      - name: Run
        run: ${{ matrix.run }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && matrix.artifact }}
        with:
          name: ${{ matrix.artifact }}
          path: e2e-out/
          retention-days: 7

      # e2e/ is not checked: kit3's own lockfile entry for the freshly packed
      # plugin tarball changes on every run.
      - name: Repo unchanged
        if: always()
        run: git diff --exit-code -- pnpm-lock.yaml examples/ playground/ packages/

  # What the Release workflow would version and pack, without publishing:
  # read-only token, no id-token, no npm credentials, no publish command.
  release-dry-run:
    name: Release dry run (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Same Node major as release.yml.
      - uses: ./.github/actions/setup
        with:
          node-version: '24'

      # Not `changeset status`: it fails on any PR that changes a package
      # without a changeset, and with --since it lists nothing.
      - name: Pending changesets
        run: |
          for f in $(find .changeset -name '*.md' ! -name README.md | sort); do
            echo "== $f"; sed -n '1,/^---$/{p}' "$f" | sed -n '1,6p'
          done

      # changelog-github looks up PR / author info on GitHub; the workflow's
      # own read-only token is enough for a public repository.
      - name: Version (in the runner only, not committed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if find .changeset -name '*.md' ! -name README.md | grep -q .; then
            pnpm changeset version
            git --no-pager diff --stat
          else
            echo "No pending changesets (e.g. the Version Packages branch)."
          fi
          echo "version: $(node -p "require('./packages/vite-devtools-svelte/package.json').version")"
          sed -n 1,12p packages/vite-devtools-svelte/CHANGELOG.md

      - name: Build plugin, inspector and client UI
        run: pnpm build

      - name: Package contents (pnpm pack, not published)
        run: |
          pnpm -C packages/vite-devtools-svelte pack --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP"/sveltejs-vite-devtools-svelte-*.tgz | sort
