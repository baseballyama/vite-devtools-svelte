name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint + format + dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type-aware lint resolves each SvelteKit app's tsconfig, which extends
      # the generated .svelte-kit/tsconfig.json; sync loads each app's
      # vite.config, which imports the built plugin.
      - name: Build plugin + SvelteKit sync
        run: |
          pnpm build:plugin
          pnpm sync:kit

      - name: Lint (oxlint, type-aware)
        run: pnpm exec oxlint

      - name: Lint Svelte components (ESLint + eslint-plugin-svelte)
        if: ${{ !cancelled() }}
        run: pnpm exec eslint .

      - name: Format check (oxfmt)
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: Unused files, exports and dependencies (knip)
        if: ${{ !cancelled() }}
        run: pnpm knip

      - name: Workspace dependency consistency (sherif)
        if: ${{ !cancelled() }}
        run: pnpm sherif

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Plugin + tests (tsc)
        run: pnpm exec tsc -p packages/vite-devtools-svelte/tsconfig.json

      - name: Client node-side code (tsc)
        if: ${{ !cancelled() }}
        run: pnpm exec tsc -p packages/client/tsconfig.node.json

      - name: Client UI (rsvelte-check)
        if: ${{ !cancelled() }}
        run: pnpm -C packages/client run check

      # Additive TypeScript 7 check (plugin + client only). The packages keep
      # typescript ^6.0.3 for peers and API consumers; the TS 7 native compiler
      # is the root @typescript/native alias, which svelte-check finds via --tsgo.
      - name: Client UI (svelte-check --tsgo, TypeScript 7, additive)
        if: ${{ !cancelled() }}
        run: |
          node node_modules/@typescript/native/bin/tsc -v
          pnpm -C examples/sample-app exec svelte-check --tsgo --workspace ../../packages/client --tsconfig ./tsconfig.app.json

      - name: Plugin + tests (tsc, TypeScript 7, additive)
        if: ${{ !cancelled() }}
        run: node node_modules/@typescript/native/bin/tsc -p packages/vite-devtools-svelte/tsconfig.json

  test:
    name: Tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm -C packages/vite-devtools-svelte build

      # Coverage thresholds are enforced per package (vitest.config.ts).
      - name: Run tests with coverage (plugin + client)
        run: pnpm test:coverage

      - name: Build client UI
        run: pnpm build:client

      # The published package: exports, files and types as consumers see them.
      - name: Package lint (publint + are-the-types-wrong)
        run: pnpm publint

  build-site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sanity build — ensures the public-facing site stays buildable
      # on every PR, mirroring the production deploy workflow.
      - name: Build site
        working-directory: site
        env:
          NODE_ENV: production
          BASE_PATH: /vite-devtools-svelte
        run: pnpm build

      # The build does not type-check. The site has no svelte-check of its
      # own; use the workspace's official svelte-check (installed in the Kit 2
      # example; the site is on Kit 3) against the site's tsconfig, after
      # svelte-kit sync.
      - name: Site typecheck (svelte-check)
        run: |
          pnpm -C site exec svelte-kit sync
          pnpm -C examples/sample-app exec svelte-check --workspace ../../site --tsconfig ./tsconfig.json

      # Screenshots of the built site (desktop / mobile, dark / light) with
      # QA: links and anchors, overflow, contrast, one h1, alt text, focus
      # styles, reduced motion, copy buttons, privacy. Any problem on the
      # built site fails the step. The live site ('before') and vite.dev
      # ('reference') are captured best effort for comparison only.
      - name: Install Chromium (workspace playwright-core)
        # The runner image already has Chrome's system libraries, so apt (whose
        # mirrors have stalled jobs until their timeout) is only used when
        # the downloaded browser cannot start without it.
        run: |
          pnpm exec playwright-core install chromium
          if ! node -e "require('playwright-core').chromium.launch().then(b => b.close())"; then
            pnpm exec playwright-core install-deps chromium
          fi

      - name: Site screenshots + QA
        run: node site/scripts/capture.mjs --out=site-shots --build=site/build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: site-shots
          path: site-shots/
          retention-days: 7

  build-playground:
    name: Playground production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin (consumed by playground)
        run: pnpm -C packages/vite-devtools-svelte build

      # Asserts the dev-only virtual modules don't leak into a production
      # bundle. If they ever do, this step fails — guarding against
      # regressions of the resolveId/load dev-only gates.
      - name: Build playground & assert no devtools runtime in output
        working-directory: playground
        env:
          NODE_ENV: production
        run: |
          pnpm exec vite build
          if grep -RIn --include='*.js' --include='*.html' 'svelte-devtools-runtime\|svelte-devtools:wrapped-client' .svelte-kit/output build 2>/dev/null; then
            echo "::error::Devtools virtual modules leaked into production build"
            exit 1
          fi

      # The example exists to enforce a nonce-based CSP; check that the built
      # app actually sends it. Only the preview server started here is stopped.
      - name: Build strict-csp-app & check its CSP response header
        working-directory: examples/strict-csp-app
        timeout-minutes: 3
        run: |
          pnpm exec vite build
          node node_modules/vite/bin/vite.js preview --port 4319 --strictPort > preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null --max-time 2 http://localhost:4319/ && break
            sleep 1
          done
          headers=$(curl -sf -D - -o /dev/null --max-time 10 http://localhost:4319/ || true)
          if ! grep -qi "^content-security-policy:.*script-src 'self' 'nonce-" <<< "$headers"; then
            echo "::error::strict-csp-app did not send its nonce-based CSP header"
            echo "$headers"
            cat preview.log
            exit 1
          fi
          grep -i '^content-security-policy:' <<< "$headers"

      # Same approach as the site typecheck: the workspace's svelte-check
      # (from the Kit 2 example) against each app's tsconfig, after sync.
      - name: Playground & strict-csp-app typecheck (svelte-check)
        # independent of the build/CSP step above: report both on one run
        if: ${{ !cancelled() }}
        run: |
          pnpm -C playground exec svelte-kit sync
          pnpm -C examples/sample-app exec svelte-check --workspace ../../playground --tsconfig ./tsconfig.json
          pnpm -C examples/strict-csp-app exec svelte-kit sync
          pnpm -C examples/sample-app exec svelte-check --workspace ../strict-csp-app --tsconfig ./tsconfig.json

  # Compatibility smoke tests (e2e/compat/README.md): the plugin in a plain
  # Svelte + Vite app, the existing SvelteKit 2 sample and a SvelteKit 3
  # fixture, each standalone and inside the Vite DevTools dock. One profile
  # at a time; every step is bounded.
  compat:
    name: Compat (${{ matrix.profile }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: compat-${{ github.ref }}-${{ matrix.profile }}-${{ matrix.mode }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [plain-svelte, kit2, kit3]
        mode: [standalone, dock]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # SvelteKit 3 needs Node >= 22.17; `22` resolves to the newest 22.x.
          node-version: 22
          cache: pnpm

      - name: Tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin and client UI
        run: pnpm build

      - name: Prepare profile
        run: node e2e/compat/prepare.mjs ${{ matrix.profile }}

      - name: Install Chromium (workspace playwright-core)
        # The runner image already has Chrome's system libraries, so apt (whose
        # mirrors have stalled jobs until their timeout) is only used when
        # the downloaded browser cannot start without it.
        run: |
          pnpm exec playwright-core install chromium
          if ! node -e "require('playwright-core').chromium.launch().then(b => b.close())"; then
            pnpm exec playwright-core install-deps chromium
          fi

      - name: Smoke test
        run: node e2e/compat/smoke.mjs ${{ matrix.profile }} ${{ matrix.mode == 'dock' && '--dock' || '' }} --tier=2

      # The smoke test must leave the repo as it found it: the workspace
      # lockfile and the existing examples untouched. (e2e/compat/kit3's own
      # lockfile entry for the freshly packed plugin tarball is expected to
      # change in CI and is not checked here.)
      - name: Repo unchanged
        if: always()
        run: git diff --exit-code -- pnpm-lock.yaml examples/ playground/ packages/

  # Reactivity end to end through MCP (e2e/reactivity.mjs): the
  # playground's /lab page (module/class state, context, props, bind:,
  # {#each}/{@const}, snippets, {#key}, {#await}, <svelte:boundary>, HMR) in
  # Chromium; checks the component tree, graph edges, problems and timeline.
  reactivity-e2e:
    name: Reactivity e2e (MCP)
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin and client UI
        run: pnpm build

      - name: Install Chromium (workspace playwright-core)
        # The runner image already has Chrome's system libraries, so apt (whose
        # mirrors have stalled jobs until their timeout) is only used when
        # the downloaded browser cannot start without it.
        run: |
          pnpm exec playwright-core install chromium
          if ! node -e "require('playwright-core').chromium.launch().then(b => b.close())"; then
            pnpm exec playwright-core install-deps chromium
          fi

      - name: Reactivity e2e
        run: node e2e/reactivity.mjs

      # the HMR edit is undone by the script
      - name: Repo unchanged
        if: always()
        run: git diff --exit-code -- pnpm-lock.yaml examples/ playground/ packages/

  # Screenshots of the reactivity UI on the SvelteKit 2 sample with the real
  # runtime (scripts/screenshots/reactivity.mjs). Images are scanned for
  # machine paths, codes and tokens before being written; a hit fails the
  # case instead of writing the image.
  reactivity-shots:
    name: Reactivity UI screenshots
    needs: [test, compat]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin and client UI
        run: pnpm build

      - name: Install Chromium (workspace playwright-core)
        # The runner image already has Chrome's system libraries, so apt (whose
        # mirrors have stalled jobs until their timeout) is only used when
        # the downloaded browser cannot start without it.
        run: |
          pnpm exec playwright-core install chromium
          if ! node -e "require('playwright-core').chromium.launch().then(b => b.close())"; then
            pnpm exec playwright-core install-deps chromium
          fi

      - name: Capture
        run: node scripts/screenshots/reactivity.mjs --out=reactivity-shots

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reactivity-shots
          path: reactivity-shots/
          retention-days: 7

      # Real MCP request/response examples for the MCP guide (token never
      # written; machine paths redacted, scanned, and fail the step if found).
      - name: MCP examples
        run: node scripts/screenshots/mcp-examples.mjs --out=mcp-examples

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mcp-examples
          path: mcp-examples/
          retention-days: 7

      - name: Repo unchanged
        if: always()
        run: git diff --exit-code -- pnpm-lock.yaml examples/ playground/ packages/

  # What the Release workflow would version and pack, without publishing:
  # read-only token, no id-token, no npm credentials, no publish command.
  release-dry-run:
    name: Release dry run (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # Same Node major as release.yml.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Tool versions
        run: node --version && pnpm --version && pnpm changeset --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release plan's input. (`changeset status` is not used: it fails
      # on any PR that changes a package without a changeset, and with
      # --since it lists nothing.)
      - name: Pending changesets
        run: |
          for f in $(find .changeset -name '*.md' ! -name README.md | sort); do
            echo "== $f"; sed -n '1,/^---$/{p}' "$f" | sed -n '1,6p'
          done

      # changelog-github looks up PR / author info on GitHub; the workflow's
      # own read-only token is enough for a public repository.
      - name: Version (in the runner only, not committed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if find .changeset -name '*.md' ! -name README.md | grep -q .; then
            pnpm changeset version
            git --no-pager diff --stat
          else
            echo "No pending changesets (e.g. the Version Packages branch)."
          fi
          echo "version: $(node -p "require('./packages/vite-devtools-svelte/package.json').version")"
          sed -n 1,12p packages/vite-devtools-svelte/CHANGELOG.md

      - name: Build plugin and client UI
        run: pnpm build

      - name: Package contents (pnpm pack, not published)
        run: |
          pnpm -C packages/vite-devtools-svelte pack --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP"/vite-devtools-svelte-*.tgz | sort
