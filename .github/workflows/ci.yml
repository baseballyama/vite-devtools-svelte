name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint + format + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Format check (oxfmt)
        run: pnpm format:check

      - name: Client typecheck (rsvelte-check)
        run: pnpm -C packages/vite-devtools-svelte/client check

  test:
    name: Plugin tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm -C packages/vite-devtools-svelte build

      - name: Run plugin tests
        run: pnpm -C packages/vite-devtools-svelte test

      - name: Build client UI
        run: pnpm build:client

  build-site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sanity build — ensures the public-facing site stays buildable
      # on every PR, mirroring the production deploy workflow.
      - name: Build site
        working-directory: site
        env:
          NODE_ENV: production
          BASE_PATH: /vite-devtools-svelte
        run: pnpm build

  build-playground:
    name: Playground production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin (consumed by playground)
        run: pnpm -C packages/vite-devtools-svelte build

      # Asserts the dev-only virtual modules don't leak into a production
      # bundle. If they ever do, this step fails — guarding against
      # regressions of the resolveId/load dev-only gates.
      - name: Build playground & assert no devtools runtime in output
        working-directory: playground
        env:
          NODE_ENV: production
        run: |
          pnpm exec vite build
          if grep -RIn --include='*.js' --include='*.html' 'svelte-devtools-runtime\|svelte-devtools:wrapped-client' .svelte-kit/output build 2>/dev/null; then
            echo "::error::Devtools virtual modules leaked into production build"
            exit 1
          fi

  # Compatibility smoke tests (compat/README.md): the plugin in a plain
  # Svelte + Vite app, the existing SvelteKit 2 sample and a SvelteKit 3
  # fixture, each standalone and inside the Vite DevTools dock. One profile
  # at a time; every step is bounded.
  compat:
    name: Compat (${{ matrix.profile }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: compat-${{ github.ref }}-${{ matrix.profile }}-${{ matrix.mode }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [plain-svelte, kit2, kit3]
        mode: [standalone, dock]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # SvelteKit 3 needs Node >= 22.17; `22` resolves to the newest 22.x.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin and client UI
        run: pnpm build

      - name: Prepare profile
        run: node scripts/compat/prepare.mjs ${{ matrix.profile }}

      - name: Install Chromium (workspace playwright-core)
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Smoke test
        run: node scripts/compat/smoke.mjs ${{ matrix.profile }} ${{ matrix.mode == 'dock' && '--dock' || '' }} --tier=2

      # The smoke test must leave the repo as it found it: the workspace
      # lockfile and the existing examples untouched. (compat/kit3's own
      # lockfile entry for the freshly packed plugin tarball is expected to
      # change in CI and is not checked here.)
      - name: Repo unchanged
        if: always()
        run: git diff --exit-code -- pnpm-lock.yaml examples/ playground/ packages/

  # Screenshots of the reactivity UI on the SvelteKit 2 sample with the real
  # runtime (scripts/screenshots/reactivity.mjs). Images are scanned for
  # machine paths, codes and tokens before being written; a hit fails the
  # case instead of writing the image.
  reactivity-shots:
    name: Reactivity UI screenshots
    needs: [test, compat]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin and client UI
        run: pnpm build

      - name: Install Chromium (workspace playwright-core)
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Capture
        run: node scripts/screenshots/reactivity.mjs --out=reactivity-shots

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reactivity-shots
          path: reactivity-shots/
          retention-days: 7

      - name: Repo unchanged
        if: always()
        run: git diff --exit-code -- pnpm-lock.yaml examples/ playground/ packages/
